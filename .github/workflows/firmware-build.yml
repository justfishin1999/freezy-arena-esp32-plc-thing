name: ESP32 firmware build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: esp32-platformio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Verify native monitoring and WebSocket tests
        run: g++ -std=c++17 -Wall -Wextra -Werror tests/test_logic.cpp -o /tmp/freezy-fieldlight-tests && /tmp/freezy-fieldlight-tests
      - name: Build ESP32 firmware
        run: pio run -e esp32dev